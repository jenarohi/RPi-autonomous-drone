# SkyScan mission control — the single source of truth for tunables.
# Paths are relative to the repository root. "{world}" / "{model}" expand from sim.world_name / sim.model_name.
# Machine-local overrides: config/skyscan.local.yaml (same structure, merged on top, gitignored).
# One-off overrides: python -m skyscan --set mission.stage_a.a2.target_alt_m=5.0

profile: sim                     # sim = Gazebo + SITL on this machine | hw = real vehicle (sim features off)

server:
  host: 0.0.0.0
  port: 8080
  telem_hz: 10                   # "telem" broadcast rate
  truth_hz: 5                    # "truth" (sim ground truth) broadcast rate
  proc_hz: 1                     # "proc" (process/sim status) broadcast rate
  mjpeg_quality: 70
  mjpeg_max_fps: 12
  runs_dir: runs                 # per-run recordings: events.jsonl, telemetry.csv, reports, snapshots

mavlink:
  url: tcp:127.0.0.1:5760        # SITL SERIAL0. Real vehicle: e.g. udpin:0.0.0.0:14550 or /dev/serial0,921600
  source_system: 245
  source_component: 190
  link_timeout_s: 3.0            # no vehicle HEARTBEAT for this long → link lost
  reconnect_s: 2.0
  heartbeat_hz: 1.0              # GCS heartbeat we send
  stream_rates_hz:               # requested with MAV_CMD_SET_MESSAGE_INTERVAL after every (re)connect
    ATTITUDE: 20
    LOCAL_POSITION_NED: 10
    GLOBAL_POSITION_INT: 10
    VFR_HUD: 4
    SYS_STATUS: 2
    EKF_STATUS_REPORT: 2
    GPS_RAW_INT: 2
    EXTENDED_SYS_STATE: 2
    HOME_POSITION: 1
    BATTERY_STATUS: 1
    GIMBAL_DEVICE_ATTITUDE_STATUS: 5

sim:
  world_name: aerothon_mission
  world_file: sim/worlds/aerothon_mission.sdf  # generated by sim/build_world.py from course_file (the legacy world)
  course_file: sim/course.yaml                 # course layout: sim world + UI map + sim truth metrics
  model_name: iris
  models_dir: sim/models                       # prepended to GZ_SIM_RESOURCE_PATH and SDF_PATH
  runtime_dir: .runtime                        # pid files, SITL eeprom/logs (gitignored)
  env_setup: /opt/robotics/drone_env/setup_drone.sh
  gz_verbosity: 2
  gz_partition: skyscan                        # private Gazebo transport partition: other gz windows on the box cannot interfere
  autostart: false                             # start Gazebo + SITL when the server starts
  start_timeout_s: 90
  sitl:
    binary: /opt/robotics/ardupilot/build/sitl/bin/arducopter
    model: JSON
    defaults: [sim/params/gazebo-iris-gimbal.parm, sim/params/skyscan_sitl.parm]
    instance: 0                                # TCP port 5760 + 10 * instance
    speedup: 1
    wipe: true                                 # -w: wipe EEPROM so the param files always apply
    fdm_port: 9002                             # ArduPilotPlugin <fdm_port_in> (UDP)
  websocket:                                   # gz-launch websocket server for the embedded 3D view (gzweb)
    enabled: true
    port: 9090
    publication_hz: 30
  gui:
    display: ":0"                              # where the optional native Gazebo GUI window opens

cameras:                         # Gazebo camera topics (sim profile) and optics
  down:                          # belly camera, looks straight down, image top = nose
    topic: /world/{world}/model/{model}/model/iris_with_standoffs/link/base_link/sensor/down_camera/image
    hfov_deg: 60.0
    mount: body_down
  front:                         # gimbal camera (earth-stabilised pitch), image top = forward/up
    topic: /world/{world}/model/{model}/model/gimbal/link/pitch_link/sensor/camera/image
    hfov_deg: 114.6
    mount: gimbal
    height_offset_m: 0.07        # camera height above the rel-alt datum (sim: gimbal hangs 0.125 m below the body, body rests 0.195 m up)
  overview:                      # static course camera rendered by Gazebo (the "Gazebo view" feed)
    topic: /world/{world}/model/overview_cam/link/link/sensor/overview/image
    hfov_deg: 70.0
    mount: fixed

vision:
  max_fps: 10                    # detection rate cap per camera
  qr:
    camera: down
    confirm_votes: 3             # identical decodes needed to confirm the start QR
    vote_window_s: 15            # votes older than this are dropped
    upscale_below_px: 140        # retry decoding at 2x when the located symbol is smaller than this
  banner:
    camera: front
    mode: floor                  # floor = the green corridor floor (the SkyScan world, legacy/create_world.py)
                                 # banner = a vertical AeroTHON banner on a stand (rulebook, solvePnP)
    # --- floor mode ---
    corridor_width_m: 3.5        # the corridor is 3.5 m wide x 10 m long
    width_tol_m: 0.6             # measured width must be within this of 3.5 m, else the detection is rejected
    min_area_px: 250
    hsv_lo: [40, 80, 30]         # OpenCV HSV (H 0..179) — floor green (0.1, 0.8, 0.1)
    hsv_hi: [85, 255, 255]
    confirm_frames: 3            # consecutive plausible detections before A4 trusts one
    # --- banner mode ---
    size_m: [3.0, 1.0]           # physical banner width, height
    min_area_frac: 0.0015        # of the image
    max_area_frac: 0.7
    aspect_range: [1.5, 6.0]     # apparent width / height (perspective included)
    min_fill: 0.65               # green contour area / fitted quad area
    text_ratio_range: [0.02, 0.5]  # white-text pixel fraction inside the quad
    plane_tilt_max_deg: 35.0     # PnP normal within this of horizontal (= vertical banner)
    min_score: 0.5

mission:
  stage_a:
    a1:
      title: Autonomous Takeoff
      takeoff_alt_m: 2.5         # A1 ends hovering here; A2 climbs to the 5 m scan altitude
      alt_tol_m: 0.3
      ready_timeout_s: 120       # wait for link / EKF / GPS / pre-arm
      arm_timeout_s: 10
      climb_timeout_s: 30
      settle_s: 2.0
      max_drift_m: 0.6           # horizontal drift from the start point allowed at the end of A1
    a2:
      title: Climb & Positioning
      target_alt_m: 5.0
      alt_tol_m: 0.25
      forward_m: 1.0
      pos_tol_m: 0.25
      speed_mps: 0.8
      timeout_s: 45
      settle_s: 2.0
    a3:
      title: Start QR Detection & Decoding
      camera: down
      gimbal_pitch_deg: -90      # park the gimbal camera looking down too (secondary view)
      dwell_s: 6.0               # wait this long at each search point for a confirmed decode
      center_over_qr: true       # if located but not decoded, move over the symbol and retry
      center_tol_m: 0.35
      search_offsets_m: [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1], [2, 0], [1, 1], [1, -1]]  # (fwd, right) from the A2 point
      scan_alt_m: 5.0            # "scan the start QR code from a 5-meter altitude"
      alt_tol_m: 0.5
      timeout_s: 90
    a4:
      title: Green Corridor Detection & Entry Alignment
      camera: front
      gimbal_pitch_deg: -25.0    # earth-stabilised: looks down the corridor floor from 5 m (entrance 8 m ahead)
      hold_alt_m: 5.0            # stays at the scan altitude: no descent in Stage A
      search_headings_deg: [0, -20, 20, -40, 40]   # relative to the course heading, tried when the corridor is not in view
      search_dwell_s: 3.0
      standoff_m: 4.0            # align this far before the entrance, along the corridor axis
      standoff_tol_m: 0.5
      lateral_tol_m: 0.3         # centre-line error allowed
      yaw_tol_deg: 5.0           # heading error vs the corridor axis allowed
      stable_s: 2.0              # alignment must hold this long
      max_refine_iters: 6
      max_travel_m: 15           # refuse alignment targets further than this from the start
      timeout_s: 150

safety:
  max_alt_m: 12.0
  geofence_radius_m: 60.0        # horizontal, from the course origin
  min_battery_pct: 25
  on_abort: hold                 # hold | land

ui:
  title: SKYSCAN MISSION CONTROL
  subtitle: AeroTHON 2026 · Track 1 · Mission 2
  team: Axiom Dynamics
